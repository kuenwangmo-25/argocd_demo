apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-simple
  labels:
    app: nginx-simple

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-simple
  template:
    metadata:
      labels:
        app: nginx-simple
    spec:
      containers:
        - name: nginx
          image: quay.io/pandeysp/nginx:latest
          ports:
            - containerPort: 80
